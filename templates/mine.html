<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>自分の書架 — たより</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08080D">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
{% include '_sky_doc.html' %}
<style>
  /* ── 自分の書架（v2 §11）──────────────────────────────
     自分が放ったことばの全部。並べるのは時間順ではなく「季節と気分の色」。
     件数・文字数・連続日数は出さない。眺めるだけで季節と色の偏りが伝わる状態が正。 */
  .season{margin:0 0 var(--s6)}
  .season-head{display:flex;align-items:baseline;gap:var(--s3);
               margin:0 0 var(--s2);color:var(--ink-3)}
  .season-head .yr{font-family:'Courier Prime',monospace;font-size:var(--t-mono);
                   letter-spacing:0.22em;color:var(--ink-4)}
  .season-head .sn{font-size:13.5px;letter-spacing:0.3em}
  /* ことばは色相の順に緯（よこいと）として並ぶ。左の糸が気分の色 */
  .shelf-words{margin:0;padding:0;list-style:none}
  .m-slip{position:relative;padding:var(--s3) 0 var(--s2) var(--s3);
          border-bottom:1px solid var(--rule-faint)}
  .m-slip:last-child{border-bottom:0}
  .m-slip::before{content:'';position:absolute;left:0;top:var(--s3);bottom:var(--s2);width:2px;
                  background:var(--slip,var(--rule));border-radius:1px}
  /* 題（v2.2 §3）。書架でも、ことばの上に小さく立つ（棚・辿ると同じ姿） */
  .m-title{margin:0 0 4px;font-size:11px;letter-spacing:0.2em;color:var(--ink-4);
           word-break:keep-all;overflow-wrap:anywhere}
  .m-poem{margin:0;font-size:var(--t-lead);line-height:2.3;letter-spacing:var(--tr-word);
          white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink-1)}
  /* 「だれかの手元にあります」＝出来事ではなく状態。現在形の一行（v2 §9） */
  .m-hands{margin:6px 0 0;font-size:11px;letter-spacing:0.2em;color:var(--ink-4);
           word-break:keep-all}
  @media (prefers-reduced-motion: no-preference){
    .m-slip{opacity:0;animation:mIn .6s var(--ease) both;
            animation-delay:calc(var(--i,0) * 50ms)}
    @keyframes mIn{from{opacity:0;transform:translateY(8px);filter:blur(3px)}
                     to{opacity:1;transform:none;filter:blur(0)}}
  }
  .state{color:var(--ink-3);font-size:12.5px;line-height:2.4;
         word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty}
  .state[hidden]{display:none}
</style>
</head>
<body>
<div class="doc">
  <a class="back" href="/mood">← tayori-たより- へ</a>

  <h1>自分の書架<span class="romaji">archive</span></h1>

  <p class="quiet">あなたが<wbr>これまでに<wbr>放った<wbr>ことばが、<wbr>季節と<wbr>気分の色の<wbr>順に<wbr>並びます。<br>
     ここは<wbr>あなたしか<wbr>見られません。<wbr>数は<wbr>数えません。</p>

  <div class="rule"></div>

  <div id="seasons"></div>
  <p class="state" id="state" hidden></p>

{% include '_sky_foot.html' %}
</div>

<script>
(function(){
  'use strict';
  const boxAll=document.getElementById('seasons'), state=document.getElementById('state');
  const SN={spring:'春',summer:'夏',autumn:'秋',winter:'冬'};
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  function say(html){ state.hidden=!html; state.innerHTML=html||''; }
  function tint(color){
    const m=/hsl\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)%\s*,\s*(\d+(?:\.\d+)?)%/.exec(color||'');
    if(m){const h=+m[1],s=+m[2],l=+m[3];
      return {text:'hsl('+h+','+Math.min(94,s+6)+'%,'+Math.min(88,l+18)+'%)',
              solid:'hsl('+h+','+s+'%,'+l+'%)'};}
    if(/^#[0-9a-f]{3,8}$/i.test(color||'')) return {text:color,solid:color};
    return null;
  }
  function render(seasons){
    boxAll.innerHTML='';
    if(!seasons.length){
      say('まだ、<wbr>何も<wbr>放っていません。<br>'+
          '最初の<wbr>ひとことを、<wbr>tayori-たより- へ<wbr>放って<wbr>みてください。');
      return;
    }
    say('');
    let idx=0;
    seasons.forEach(g=>{
      const sec=document.createElement('section');sec.className='season';
      sec.innerHTML='<div class="season-head"><span class="yr">'+esc(g.year)+'</span>'+
        '<span class="sn">'+esc(SN[g.season]||'')+'</span></div>'+
        '<ul class="shelf-words"></ul>';
      const ul=sec.querySelector('.shelf-words');
      // 季節の中は、時間ではなく色相の環の順に（v2 §11：季節と気分の色で並べる）
      const words=g.words.slice().sort((a,b)=>(a.hue==null)-(b.hue==null)||(a.hue||0)-(b.hue||0));
      words.forEach(w=>{
        const li=document.createElement('li');li.className='m-slip';
        li.style.setProperty('--i',idx++);
        li.innerHTML=(w.title?'<p class="m-title"></p>':'')+'<p class="m-poem"></p>';
        if(w.title)li.querySelector('.m-title').textContent=w.title;
        li.querySelector('.m-poem').textContent=w.poem;
        const c=tint(w.color);
        if(c){li.style.setProperty('--slip',c.solid);
              li.querySelector('.m-poem').style.color=c.text;}
        if(w.in_someones_hands){
          const p=document.createElement('p');p.className='m-hands';
          p.innerHTML='このことばは、<wbr>だれかの手元に<wbr>あります。';
          li.appendChild(p);
        }
        // 付箋はここに出ない（v2.2 §3）：付箋は読み手が自分の棚に貼るもので、
        // 書き手が自分のことばに付けるのは題だけ。書架には、そもそも存在しない。
        ul.appendChild(li);
      });
      boxAll.appendChild(sec);
    });
  }
  fetch('/api/mine').then(r=>r.ok?r.json():null)
    .then(d=>{ if(!d||!d.seasons)throw new Error('mine'); render(d.seasons); })
    .catch(()=>say('書架が<wbr>遠いようです。<br>すこし<wbr>待ってから、<wbr>もう一度。'));
})();
</script>
</body>
</html>
