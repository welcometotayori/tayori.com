<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>手元の棚 — たより</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08080D">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
{% include '_sky_doc.html' %}
<style>
  /* ── 手元の棚（v13／v14で作法を宙と揃えた）──────────────────
     宙で出会って、残したいと思ったことばだけの場所。本人しか見えない。
     数も順位も出さない（何通あるかを数えはじめると、棚が成績表になる）。
     宙では縦書きで漂っていたことばも、棚では横に寝かせる：ここは眺める場所ではなく
     読み返す場所なので、読みやすさを取る。
     一枚ずつが「付箋」。箱は作らず、左の色糸と下の罫だけで区切る。 */
  .slips{margin:0;padding:0;list-style:none}
  .slip{position:relative;padding:var(--s4) 0 var(--s3) var(--s3);
        border-bottom:1px solid var(--rule-faint)}
  .slip:last-child{border-bottom:0}
  /* 付箋の左に一本、そのことばの気分の色（--slip は JS が差す） */
  .slip::before{content:'';position:absolute;left:0;top:var(--s4);bottom:var(--s3);width:2px;
                background:var(--slip,var(--rule));border-radius:1px}
  .slip-poem{margin:0 0 var(--s2);font-size:var(--t-lead);line-height:2.4;
             letter-spacing:var(--tr-word);white-space:pre-wrap;
             word-break:keep-all;overflow-wrap:anywhere;color:var(--ink-1)}
  .slip-foot{display:flex;align-items:center;gap:var(--s3)}
  .slip-when{font-family:'Courier Prime',monospace;font-size:var(--t-mono);
             letter-spacing:0.18em;color:var(--ink-4)}
  /* 外すのは「棚から降ろす」だけ。ことばそのものは宙にも配達にも残る */
  .slip-off{min-height:var(--touch);background:none;border:none;border-bottom:1px solid transparent;
            color:var(--ink-3);font-family:inherit;font-size:11.5px;letter-spacing:0.18em;
            padding:13px 2px;transition:color .22s var(--ease),
            border-color .22s var(--ease),opacity .22s var(--ease)}
  .slip-off:hover{color:var(--ink-1);border-bottom-color:var(--rule-act)}
  .slip-off:active{opacity:.62}
  /* 一枚ずつ、順に置かれる（まとめて点灯させない） */
  @media (prefers-reduced-motion: no-preference){
    .slip{opacity:0;animation:slipIn .6s var(--ease) both;
          animation-delay:calc(var(--i,0) * 70ms)}
    @keyframes slipIn{from{opacity:0;transform:translateY(8px);filter:blur(3px)}
                        to{opacity:1;transform:none;filter:blur(0)}}
  }
  /* 何も無い時・届かない時の、ひとこと（棚は空でも成立する場所） */
  .state{color:var(--ink-3);font-size:12.5px;line-height:2.4;
         word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty}
  .state[hidden]{display:none}
</style>
</head>
<body>
<div class="doc">
  <a class="back" href="/mood">← tayori-たより- へ</a>

  <h1>手元の棚<span class="romaji">shelf</span></h1>

  <p class="quiet">tayori-たより- で<wbr>出会って、<wbr>残したいと<wbr>思った<wbr>ことばだけが<wbr>ここに<wbr>あります。<br>
     この棚は<wbr>あなたしか<wbr>見られません。<wbr>だれが<wbr>書いたかは、<wbr>棚の中でも<wbr>分かりません。</p>

  <div class="rule"></div>

  <ul class="slips" id="slips" aria-label="棚に残したことば"></ul>
  <p class="state" id="state" hidden></p>

{% include '_sky_foot.html' %}
</div>

<script>
(function(){
  'use strict';
  const box=document.getElementById('slips'), state=document.getElementById('state');
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  function say(html){ state.hidden=!html; state.innerHTML=html||''; }
  /* 気分の色を、闇の中で読める文字色へ（宙の tintOf と同じ作法） */
  function tint(color){
    const m=/hsl\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)%\s*,\s*(\d+(?:\.\d+)?)%/.exec(color||'');
    if(m){const h=+m[1],s=+m[2],l=+m[3];
      return {text:'hsl('+h+','+Math.min(94,s+6)+'%,'+Math.min(88,l+18)+'%)',
              solid:'hsl('+h+','+s+'%,'+l+'%)'};}
    if(/^#[0-9a-f]{3,8}$/i.test(color||'')) return {text:color,solid:color};
    return null;
  }
  function whenLabel(iso){
    const p=String(iso||'').slice(0,10).split('-');
    return p.length===3?(p[0]+'.'+p[1]+'.'+p[2]):'';
  }
  function render(words){
    box.innerHTML='';
    if(!words.length){
      say('まだ、<wbr>何も<wbr>残していません。<br>'+
          'tayori-たより- で<wbr>ことばに<wbr>触れて<wbr>「手元に、<wbr>残す」<wbr>を<wbr>選ぶと、<wbr>ここへ<wbr>置かれます。');
      return;
    }
    say('');
    words.forEach((w,i)=>{
      const li=document.createElement('li');li.className='slip';
      li.style.setProperty('--i',i);
      li.innerHTML='<p class="slip-poem">'+esc(w.poem)+'</p>'+
        '<div class="slip-foot"><span class="slip-when">'+esc(whenLabel(w.saved_at))+'</span>'+
        '<button type="button" class="slip-off">棚から、外す</button></div>';
      const c=tint(w.color);
      if(c){
        li.style.setProperty('--slip',c.solid);      // 左の糸は、そのことばの気分の色
        li.querySelector('.slip-poem').style.color=c.text;
      }
      li.querySelector('.slip-off').addEventListener('click',async(e)=>{
        const b=e.currentTarget; b.disabled=true;
        try{
          const r=await fetch('/api/shelf',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({src:w.src,ref:w.ref,on:false})});
          if(!r.ok)throw new Error('off');
          // 外した一枚だけを、そのまま静かに降ろす（全部を再描画して並びを揺らさない）
          li.style.transition='opacity .4s var(--ease),transform .4s var(--ease)';
          li.style.opacity='0'; li.style.transform='translateY(-4px)';
          setTimeout(()=>{ li.remove(); if(!box.children.length)load(); },420);
        }catch(err){ b.disabled=false; say('いま、<wbr>棚に<wbr>手が<wbr>届きませんでした。'); }
      });
      box.appendChild(li);
    });
  }
  function load(){
    fetch('/api/shelf').then(r=>r.ok?r.json():null)
      .then(d=>{ if(!d||!d.words)throw new Error('shelf'); render(d.words); })
      .catch(()=>say('棚が<wbr>遠いようです。<br>すこし<wbr>待ってから、<wbr>もう一度。'));
  }
  load();
})();
</script>
</body>
</html>
