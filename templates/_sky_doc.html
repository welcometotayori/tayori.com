{# 宙の外の紙（/about・/philosophy・/operator・/contact）と手元の棚で共通の見た目。
   素材と寸法は _sky_tokens.html。ここは「紙の組み方」だけを持つ。
   宙とトーンを揃える：闇・明朝・大きな余白・罫だけ。カードも錠剤も影も作らない
   （v3.10 の物質メタファー＝汎用コンポーネント原型を持ち込まない）。 #}
{% include '_sky_tokens.html' %}
<style>
  html{-webkit-text-size-adjust:100%}
  body{margin:0;padding:0 var(--s3) var(--s6)}
  .doc{max-width:min(92vw,520px);margin:0 auto}
  /* 宙へ戻る道は、いつでも左上に一本だけ（罫は引かない：戻るのは操作ではなく道） */
  .back{display:inline-block;min-height:var(--touch);margin:var(--s3) 0 0;padding:14px 2px;
        color:var(--ink-3);text-decoration:none;font-size:11.5px;letter-spacing:0.22em;
        transition:color .22s var(--ease),opacity .22s var(--ease)}
  .back:hover{color:var(--ink-1)}
  .back:active{opacity:.62}
  /* 見出し：大きい字ほど字間を詰め、行間も締める（Apple §15） */
  h1{margin:var(--s5) 0 var(--s5);font-size:14px;font-weight:500;letter-spacing:0.34em;
     line-height:1.6;text-align:center;color:var(--ink-2)}
  h1 .romaji{display:block;margin-top:var(--s2);font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
             font-size:9px;letter-spacing:0.42em;color:var(--thread);text-transform:uppercase}
  h2{margin:var(--s5) 0 var(--s3);font-size:var(--t-body);font-weight:500;letter-spacing:0.24em;
     line-height:1.9;color:var(--ink-1)}
  p{margin:0 0 var(--s4);font-size:13.5px;line-height:2.5;letter-spacing:var(--tr-body);
    word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty}
  .quiet{color:var(--ink-3);font-size:12.5px;line-height:2.3}
  a{color:var(--thread);text-decoration:underline;text-underline-offset:4px}
  /* 区切りは線を引くのではなく、紙に入った一本の罫（両端が消えていく） */
  .rule{height:1px;margin:var(--s5) 0;border:0;
        background:linear-gradient(90deg,transparent,var(--rule),transparent)}
  .mail{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;font-size:12.5px;letter-spacing:0.06em}
  /* 他の紙へ渡る足元。並べるだけで、押しつけない */
  .foot{margin-top:var(--s6)}
  .foot-links{display:flex;flex-wrap:wrap;gap:0 var(--s3);justify-content:center;
              margin:0 0 var(--s3);padding:0;list-style:none}
  .foot-links a{display:block;min-height:var(--touch);padding:13px 4px;
                color:var(--ink-4);text-decoration:none;font-size:11.5px;
                letter-spacing:0.18em;transition:color .22s var(--ease),opacity .22s var(--ease)}
  .foot-links a:hover{color:var(--ink-1)}
  .foot-links a:active{opacity:.62}
  .foot-mail{text-align:center;font-size:11.5px;letter-spacing:0.1em;color:var(--ink-4)}
  .foot-mail a{color:var(--thread)}
  /* 紙は、開いた時に立ち上がる（不透明度だけでなく縮尺も動かす／Apple §12）。
     読み物なので控えめに、一度だけ。 */
  @media (prefers-reduced-motion: no-preference){
    .doc{animation:docIn .7s var(--ease) both}
    @keyframes docIn{from{opacity:0;transform:translateY(6px);scale:.996}}
  }
</style>
